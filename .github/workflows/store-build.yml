# Starts a store (production) build on EAS from a clean Linux checkout, so its runtime fingerprint
# matches what the "Preview update" workflow publishes. Builds made on Windows don't match.
# Run it by hand from the Actions tab. Needs the EXPO_TOKEN repository secret.
#
# Android makes an app bundle for Google Play. iOS needs the club's Apple developer account first.
# ios-simulator is a test iPhone build for the iOS Simulator: it needs no Apple account, and the job
# waits for it, so a red job means the iPhone app doesn't compile.
# android-preview is the tester APK (preview channel) for Jeff's S25 and the test crew. Make one
# whenever app.json or package.json changes, since that moves the runtime fingerprint and the old
# install stops taking over-the-air updates. Install it from the EAS build page on the phone.
name: Store build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [android, ios, all, ios-simulator, android-preview]
        default: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The build itself runs on EAS; --no-wait ends this job once it's queued. The build page link
      # is in the log. Env vars (Google Maps key) come from the EAS "production" environment.
      - env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$PLATFORM" = ios-simulator ]; then
            eas build --profile ios-simulator --platform ios --non-interactive
          elif [ "$PLATFORM" = android-preview ]; then
            eas build --profile preview --platform android --non-interactive --no-wait
          else
            eas build --profile production --platform "$PLATFORM" --non-interactive --no-wait
          fi
