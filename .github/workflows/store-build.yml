# Starts a store (production) build on EAS from a clean Linux checkout, so its runtime fingerprint
# matches what the "Preview update" workflow publishes. Builds made on Windows don't match.
# Run it by hand from the Actions tab. Needs the EXPO_TOKEN repository secret.
#
# Android makes an app bundle for Google Play.
# iPhone uses the App Store Connect team key "EAS build" (Admin): its .p8 text is the ASC_API_KEY_P8
# repository secret, and the ids below aren't secret. With it EAS signs in to Apple without a password.
#   ios-setup  the FIRST iPhone build only: runs eas build interactively (see .github/scripts/
#              eas-ios-setup.exp) so EAS can make the distribution certificate and profiles.
#   ios        every later iPhone build (non-interactive, reuses what ios-setup made).
#   ios-submit uploads the latest iPhone store build to App Store Connect / TestFlight (needs
#              ascAppId in eas.json; run it once the build has finished).
# ios-simulator is a test iPhone build for the iOS Simulator: it needs no Apple account, and the job
# waits for it, so a red job means the iPhone app doesn't compile.
# android-preview is the tester APK (preview channel) for Jeff's S25 and the test crew. Make one
# whenever app.json, a native module or a package.json dependency changes, since that moves the
# runtime fingerprint and the old install stops taking over-the-air updates (npm scripts don't:
# fingerprint.config.js skips them). Install it from the EAS build page on the phone.
name: Store build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [android, ios, all, ios-simulator, android-preview, ios-setup, ios-submit]
        default: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The key goes in .asc/ (git-ignored, so EAS never uploads it with the project); eas.json's
      # iOS submit profile reads it from there.
      - name: App Store Connect key
        if: contains(fromJSON('["ios", "all", "ios-setup", "ios-submit"]'), inputs.platform)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p .asc
          # Rewraps the pasted key into a clean .p8 (Windows pastes break it) and checks it's a real
          # PKCS#8 key before eas-cli tries it. Neither step prints the key.
          python3 .github/scripts/write-asc-key.py .asc/AuthKey.p8
          if ! openssl pkey -in .asc/AuthKey.p8 -noout 2>/dev/null; then
            echo "::error::ASC_API_KEY_P8 looks like a key but isn't a valid one; copy the .p8 file's text again"
            exit 1
          fi
          {
            echo "EXPO_ASC_API_KEY_PATH=$PWD/.asc/AuthKey.p8"
            echo "EXPO_ASC_KEY_ID=GZ4F28YT8V"
            echo "EXPO_ASC_ISSUER_ID=7ef898c5-8375-4f11-b43f-e41cc28c8c30"
            echo "EXPO_APPLE_TEAM_ID=M873J4CTU6"
            echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
          } >> "$GITHUB_ENV"
      # eas-cli treats CI=true as --non-interactive, which can't create a missing certificate.
      - name: First iPhone build (makes the signing certificate and profiles)
        if: inputs.platform == 'ios-setup'
        env:
          CI: 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq expect
          expect .github/scripts/eas-ios-setup.exp
      # --latest takes the newest store build (never a simulator one), even one still building.
      - name: Upload the latest iPhone build to TestFlight
        if: inputs.platform == 'ios-submit'
        run: |
          if ! node -e "process.exit(require('./eas.json').submit.production.ios.ascAppId ? 0 : 1)"; then
            echo "::error::Put the App Store Connect app's Apple ID in eas.json submit.production.ios.ascAppId first"
            exit 1
          fi
          eas submit --platform ios --profile production --latest --non-interactive
      # The build itself runs on EAS; --no-wait ends this job once it's queued. The build page link
      # is in the log. Env vars (Google Maps key) come from the EAS "production" environment.
      - if: inputs.platform != 'ios-setup' && inputs.platform != 'ios-submit'
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$PLATFORM" = ios-simulator ]; then
            eas build --profile ios-simulator --platform ios --non-interactive
          elif [ "$PLATFORM" = android-preview ]; then
            eas build --profile preview --platform android --non-interactive --no-wait
          else
            eas build --profile production --platform "$PLATFORM" --non-interactive --no-wait
          fi
