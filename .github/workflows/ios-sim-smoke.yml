# Opens the iPhone app in a simulator and prints why it closes, if it does. Builds the ios-simulator
# profile on EAS from this commit, then installs and launches it on a macOS runner and prints the
# app's log and any crash report. It goes red if the app isn't running 45 seconds after opening.
# Run it by hand (each run is an EAS iPhone build, and the free plan builds one at a time, so don't
# start it while a store build is waiting). The log and artifacts are public (public repository).
name: iPhone simulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

# One at a time on any branch, never cancelled: a cancelled job leaves its EAS build running.
concurrency:
  group: ios-sim-smoke
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.build.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - id: build
        run: |
          eas build --profile ios-simulator --platform ios --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url=$(node -p "require('$RUNNER_TEMP/build.json')[0].artifacts.buildUrl")
          echo "Simulator build: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  launch:
    needs: build
    runs-on: macos-15
    steps:
      - name: Install and open the app
        env:
          URL: ${{ needs.build.outputs.url }}
        run: |
          curl -fsSL "$URL" -o app.tar.gz
          mkdir app && tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name '*.app' | head -1)
          echo "App: $APP"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ids=[(rt,x['udid'],x['name']) for rt,xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone')]
          ids.sort(); print(ids[-1][1]); sys.stderr.write(str(ids[-1])+'\n')")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          (xcrun simctl launch --console-pty "$DEVICE" au.com.rustnutssmc.app > launch.log 2>&1 &)
          sleep 45
          echo "=== still running? ==="
          RUNNING=yes
          # launchctl lists PID, status, label; a job left behind by an app that exited has PID "-".
          xcrun simctl spawn "$DEVICE" launchctl list | awk 'tolower($3) ~ /rustnuts/ && $1 ~ /^[0-9]+$/ {print; found=1} END {exit !found}' || { RUNNING=no; echo "NOT RUNNING"; }
          xcrun simctl io "$DEVICE" screenshot shot.png || true
          echo "=== console ==="
          tail -200 launch.log || true
          echo "=== app log ==="
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "Rustnuts" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "fatal" OR eventMessage CONTAINS[c] "error")' | tail -200 || true
          echo "=== crash reports ==="
          mkdir -p reports
          for f in ~/Library/Logs/DiagnosticReports/Rustnuts*; do
            [ -e "$f" ] || continue
            RUNNING=no
            cp "$f" reports/
            echo "--- $f"; head -c 20000 "$f"
          done
          if [ "$RUNNING" != yes ]; then
            echo "::error::The app closed in the simulator; the reason is printed above"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            shot.png
            launch.log
            reports/
