# Publishes the site/ folder (privacy policy, support and account deletion pages) to GitHub Pages on every push to
# main, together with the web version of the app for helpers on a PC (scripts/web-preview.sh), which is built here
# fresh each time so it always matches main. Needs Settings → Pages → Source set to "GitHub Actions" once.
name: Privacy page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The PC web version at /RUSTNUTS-APP/pc-d672883cc4ca/ (unlinked, behind the roster sign-in).
      - run: scripts/web-preview.sh pc-d672883cc4ca
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
