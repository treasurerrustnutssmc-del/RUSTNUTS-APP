# Publishes the site/ folder (privacy policy, support and account deletion pages) to GitHub Pages on every push to
# main. The web version of the app for helpers on a PC used to be built here too; it was retired on 18 Nov 2026 so
# the repository can go private (the club-website copies at www.rustnutssmc.com.au/app/ are the addresses the stores
# use). Needs Settings → Pages → Source set to "GitHub Actions" once.
name: Privacy page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
