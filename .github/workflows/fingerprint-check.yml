# Temporary diagnostic: works out which runtime fingerprint CI computes, with and without the
# EAS "preview" environment, without publishing anything. Prints per-source hashes only.
name: Fingerprint check

on:
  push:
    branches: [claude/project-thread-yqpklu]
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Dry run of the preview update
        env:
          MESSAGE: Dry run
          DRY_RUN: '1'
        run: |
          scripts/preview-update.sh
          git status --short | head
